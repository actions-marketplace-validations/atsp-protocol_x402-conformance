name: Managed services enquiry
description: Ask about monitoring, signed conformance reports, custom checks or priority support
title: "Managed services: "
labels: [managed-services]
body:
  - type: markdown
    attributes:
      value: >-
        The suite stays free and open. This form is for the paid services in docs/MANAGED.md. Please don't post
        secrets, keys or wallet addresses here. Prefer email? Write to data@optitransfer.ch.
  - type: dropdown
    id: service
    attributes:
      label: Which service?
      multiple: true
      options: [Continuous monitoring, Signed conformance reports, Custom checks, Priority support, Not sure yet]
    validations: { required: true }
  - type: input
    id: project
    attributes: { label: Your facilitator, resource server or SDK (name and URL) }
    validations: { required: true }
  - type: textarea
    id: need
    attributes: { label: What you need, and any timeline }
    validations: { required: true }
  - type: checkboxes
    id: partner
    attributes:
      label: Design partner
      options:
        - label: I'd like to be considered for design-partner pricing (first three customers)
